name: Publish Production

on:
  push:
    branches:
      - main

concurrency:
  group: publish-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write  # <-- Required for buildx v6 attestation handling
  id-token: write      # <-- Required for OIDC signing of the VEX statement

env:
  IMAGES_JSON: images.json

jobs:
  validate-core:
    name: Lint – ubuntu-noble-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Core Configuration
        id: core-config
        shell: bash
        run: |
          set -euo pipefail
          CORE_CONFIG=$(jq -r '.images[] | select(.key == "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")
          if [ -z "$CORE_CONFIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo "$CORE_CONFIG" | jq -r '.dockerfile')" >> "$GITHUB_OUTPUT"
          echo "lintTarget=$(echo "$CORE_CONFIG" | jq -r '.lintTarget')" >> "$GITHUB_OUTPUT"
      
      - uses: docker/setup-buildx-action@v3
      - name: Lint – ubuntu-noble-core
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.core-config.outputs.dockerfile }}
          target: ${{ steps.core-config.outputs.lintTarget }}
          push: false

  publish-core:
    name: Publish – ubuntu-noble-core
    runs-on: ubuntu-latest
    needs: [validate-core]
    if: always() && needs.validate-core.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Get core image config
        id: core-config
        shell: bash
        run: |
          CORE_CONFIG=$(jq -r '.images[] | select(.key == "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")
          if [ -z "$CORE_CONFIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo "$CORE_CONFIG" | jq -r '.dockerfile')" >> "$GITHUB_OUTPUT"
          echo "prodTarget=$(echo "$CORE_CONFIG" | jq -r '.prodTarget')" >> "$GITHUB_OUTPUT"
          
          REPO=$(echo "$CORE_CONFIG" | jq -r '.repo')
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          
          TAGS=$(echo "$CORE_CONFIG" | jq -r '.prodTags[]')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $TAGS; do echo "${REPO}:${TAG}" >> "$GITHUB_OUTPUT"; done
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push – ubuntu-noble-core
        id: build_core
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.core-config.outputs.dockerfile }}
          target: ${{ steps.core-config.outputs.prodTarget }}
          push: true
          tags: ${{ steps.core-config.outputs.tags }}

      - name: Calculate and Report True Uncompressed Size
        id: calculate_size
        if: steps.core-config.outputs.skip == 'false' && steps.build_core.outcome == 'success'
        shell: bash
        run: |
          echo "======= Calculating True Uncompressed Image Size ======="
          TARGET_IMAGE="${{ steps.core-config.outputs.repo }}@${{ steps.build_core.outputs.digest }}"
          echo "Pulling $TARGET_IMAGE to runner..."
          docker pull "$TARGET_IMAGE"
          SIZE_BYTES=$(docker image inspect "$TARGET_IMAGE" --format='{{.Size}}')
          SIZE_MB=$(echo "$SIZE_BYTES" | awk '{printf "%.2f", $1 / 1024 / 1024}')
          echo "uncompressed_size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          
          echo "### 📊 Kasm 1.1 Image Size Analysis: ubuntu-noble-core" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Key** | \`ubuntu-noble-core\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build_core.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **True Uncompressed Size** | **${SIZE_MB} MB** |" >> $GITHUB_STEP_SUMMARY

  matrix-others:
    name: Build matrix (non-core)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_entries: ${{ steps.set.outputs.has_entries }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix from images.json
        id: set
        shell: bash
        run: |
          set -euo pipefail
          VALID_ENTRIES=$(jq -c '[.images[] | select(.key != "ubuntu-noble-core" and .enabled != false)]' "$IMAGES_JSON")
          if [ "$VALID_ENTRIES" == "[]" ] || [ -z "$VALID_ENTRIES" ]; then
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATRIX="$(jq -c '{include: [.images[] | select(.key != "ubuntu-noble-core" and .enabled != false) | {
            key: .key, dockerfile: .dockerfile, repo: .repo, lintTarget: .lintTarget, prodTarget: .prodTarget, prodTags: .prodTags
          }]}' "$IMAGES_JSON")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_entries=true" >> "$GITHUB_OUTPUT"

  validate-others:
    name: Lint – ${{ matrix.key }}
    runs-on: ubuntu-latest
    needs: [matrix-others]
    if: needs.matrix-others.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-others.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint – ${{ matrix.key }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.lintTarget }}
          push: false
          build-args: |
            BASE_TAG=latest

  publish-others:
    name: Publish – ${{ matrix.key }}
    runs-on: ubuntu-latest
    needs: [matrix-others, validate-others, publish-core]
    if: |
      always() && 
      needs.matrix-others.outputs.has_entries == 'true' &&
      (needs.validate-others.result == 'success' || needs.validate-others.result == 'skipped') &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-others.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Format Tags
        id: tags
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          echo '${{ toJson(matrix.prodTags) }}' | jq -r '.[]' | while read TAG; do
            echo "${{ matrix.repo }}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push – ${{ matrix.key }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.prodTarget }}
          push: true
          tags: ${{ matrix.tags }}
          # Attach the VEX data inside an officially supported attestation format:
          provenance: true
          sbom: true
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner,vulnerability-vulnerabilities=@images/vex_ubuntu_common.json
          cache-from: type=gha,scope=pubprod-${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=pubprod-${{ matrix.key }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Image: ${{ matrix.repo }}"
          echo "Push outcome: ${{ steps.push.outcome || 'skipped' }}"

      - name: Calculate and Report True Uncompressed Size
        id: calculate_size
        if: steps.push.outcome == 'success'
        shell: bash
        run: |
          echo "======= Calculating True Uncompressed Image Size ======="
          TARGET_IMAGE="${{ matrix.repo }}@${{ steps.push.outputs.digest }}"
          echo "Pulling $TARGET_IMAGE to runner..."
          docker pull "$TARGET_IMAGE"
          SIZE_BYTES=$(docker image inspect "$TARGET_IMAGE" --format='{{.Size}}')
          SIZE_MB=$(echo "$SIZE_BYTES" | awk '{printf "%.2f", $1 / 1024 / 1024}')
          echo "uncompressed_size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          
          echo "### 📊 Kasm 1.1 Image Size Analysis: ${{ matrix.key }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Key** | \`${{ matrix.key }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **True Uncompressed Size** | **${SIZE_MB} MB** |" >> $GITHUB_STEP_SUMMARY
