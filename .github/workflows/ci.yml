name: CI (Lint Gate)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES_JSON: images.json

jobs:
  validate-core:
    name: Lint – ubuntu-noble-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Core Configuration Presence
        id: core-config
        shell: bash
        run: |
          set -euo pipefail
          CORE_CONFIG=$(jq -r '.images[] | select(.key == "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")
          
          if [ -z "$CORE_CONFIG" ]; then
            echo "❌ CRITICAL ERROR: 'ubuntu-noble-core' is missing or disabled in images.json!" >&2
            echo "The core foundation layer is a mandatory pipeline invariant." >&2
            exit 1
          fi
          
          echo "dockerfile=$(echo "$CORE_CONFIG" | jq -r '.dockerfile')" >> "$GITHUB_OUTPUT"
          echo "lintTarget=$(echo "$CORE_CONFIG" | jq -r '.lintTarget')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint – ubuntu-noble-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.core-config.outputs.dockerfile }}
          target: ${{ steps.core-config.outputs.lintTarget }}
          push: false

  matrix-others:
    name: Build matrix (non-core)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_entries: ${{ steps.set.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix from images.json
        id: set
        shell: bash
        run: |
          set -euo pipefail
          VALID_ENTRIES=$(jq -c '[.images[] | select(.key != "ubuntu-noble-core" and .enabled != false)]' "$IMAGES_JSON")
          if [ "$VALID_ENTRIES" == "[]" ] || [ -z "$VALID_ENTRIES" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          MATRIX="$(jq -c '{include: [.images[] | select(.key != "ubuntu-noble-core" and .enabled != false) | {
            key: .key,
            dockerfile: .dockerfile,
            repo: .repo,
            lintTarget: .lintTarget
          }]}' "$IMAGES_JSON")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_entries=true" >> "$GITHUB_OUTPUT"

  validate-others:
    name: Lint – ${{ matrix.key }}
    runs-on: ubuntu-latest
    needs: [matrix-others]
    if: needs.matrix-others.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-others.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint – ${{ matrix.key }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.lintTarget }}
          push: false
          tags: ${{ matrix.repo }}:ci-lint

  lint-gate:
    name: lint / gate
    runs-on: ubuntu-latest
    needs: [validate-core, validate-others]
    if: always()
    steps:
      - name: Check linting results
        run: |
          if [[ "${{ needs.validate-core.result }}" == "failure" || "${{ needs.validate-others.result }}" == "failure" ]]; then
            echo "One or more lint checks explicitly failed. Blocking execution."
            exit 1
          fi
          echo "All structural gates cleared successfully."
