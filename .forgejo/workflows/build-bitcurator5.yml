name: Build BitCurator 5
run-name: BitCurator 5 Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/bitcurator5/**'
      - 'src/ubuntu/**'
      - 'src/tools/**'
      - 'images.json'
      - '.forgejo/workflows/build-bitcurator5.yml'
  workflow_run:
    workflows: ["Build Noble Core"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Build Target Environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - production

concurrency:
  group: build-bitcurator5-${{ github.event.inputs.target_env || 'develop' }}
  # Image builds are expensive - let a running build finish and queue the next
  # trigger rather than killing it mid-run (which surfaces as buildkit
  # "graceful_stop" / GOAWAY).
  cancel-in-progress: false

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  IMAGE_KEY: bitcurator5
  DOCKERFILE_PATH: images/bitcurator5/Dockerfile

jobs:
  build-isolated-bitcurator5:
    name: Build Workspace
    runs-on: [kasm-builder, repo-bitcurator5, resources-large]
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || 
      (github.event_name == 'workflow_run' && 
      github.event.workflow_run.conclusion == 'success' && 
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main'))
    outputs:
      repo_path: ${{ steps.prep.outputs.repo_path }}
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git Diff Guard
        id: guard
        if: ${{ github.event_name == 'push' }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'images/ubuntu-noble-core/'; then
            echo "::notice:: Core foundation files modified; the Core build cascades this workspace via workflow_run. Skipping the push here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # bitcurator5 is a work in progress (images.json .enabled = false). Only a
      # manual workflow_dispatch builds it; push / core-cascade runs skip so the
      # ~3h SaltStack build does not burn a runner on every Core change.
      - name: Enabled Guard
        id: enabled
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          EN=$(jq -r '.images[] | select(.key == "bitcurator5") | .enabled' images.json)
          if [ "$EN" != "true" ]; then
            echo "::notice:: bitcurator5 is disabled in images.json; skipping. Use workflow_dispatch to iterate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config-inline: |
            [registry."forge.konderla.org"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Builds the Dockerfile's `lint` stage (shellcheck + hadolint), which is
      # defined + referenced in images.json but was never run by CI.
      # Starts non-blocking; flip `continue-on-error` to false once it is green.
      - name: Lint (shellcheck + hadolint)
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: lint
          platforms: linux/amd64
          push: false
          pull: true

      - name: Extract Tags from images.json
        id: prep
        run: |
          JSON_FILE="$GITHUB_WORKSPACE/images.json"
          ENV_SELECTION="${{ github.event.inputs.target_env || 'develop' }}"
          
          if [ "$ENV_SELECTION" = "production" ]; then
            TAG_ARRAY="prodTags"
            TARGET_KEY="prodTarget"
            BASE_TAG="latest"
          else
            TAG_ARRAY="devTags"
            TARGET_KEY="devTarget"
            BASE_TAG="develop"
          fi
          
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          IMAGE_CONFIG=$(jq -c ".images[] | select(.key == \"${{ env.IMAGE_KEY }}\")" "$JSON_FILE")
          RAW_TAGS=$(echo "$IMAGE_CONFIG" | jq -r ".${TAG_ARRAY}[]")
          REPO_FORGE=$(echo "$IMAGE_CONFIG" | jq -r ".repo_forge")
          echo "repo_path=${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}" >> "$GITHUB_OUTPUT"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $RAW_TAGS; do
            echo "${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"
          BUILD_TARGET=$(echo $IMAGE_CONFIG | jq -r ".${TARGET_KEY}")
          echo "target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Compile and Push Isolated Workspace
        id: build_image
        if: ${{ steps.guard.outputs.skip != 'true' && steps.enabled.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        timeout-minutes: 180
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: ${{ steps.prep.outputs.target }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          # This image is not Trivy-scanned in CI (only ubuntu-noble-core is -
          # BitCurator 5 builds FROM that already-scanned base).
          sbom: false
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ env.HARBOR_REGISTRY }}/squirrelworksllc/ubuntu-noble-core
            BASE_TAG=${{ steps.prep.outputs.base_tag }}

  calculate-size:
    name: Size Calculation
    needs: build-isolated-bitcurator5
    if: ${{ needs.build-isolated-bitcurator5.outputs.digest != '' }}
    uses: ./.forgejo/workflows/calculate-size.yml
    with:
      image_path: "${{ needs.build-isolated-bitcurator5.outputs.repo_path }}@${{ needs.build-isolated-bitcurator5.outputs.digest }}"
      image_key: "bitcurator5"
      runner: '["kasm-builder", "repo-bitcurator5", "resources-large"]'
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
