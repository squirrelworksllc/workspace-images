name: Build Noble Core
run-name: Core Foundation Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/ubuntu-noble-core/**'
      - 'src/ubuntu/install/common/**'
      - 'src/ubuntu/install/tools/**'
      - 'src/tools/**'
      - 'images.json'
      - '.forgejo/workflows/build-noble-core.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Build Target Environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - production
      skip_scan:
        description: 'Bypass Trivy Vulnerability Scan'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-core-${{ github.event.inputs.target_env || 'develop' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  IMAGE_KEY: ubuntu-noble-core
  DOCKERFILE_PATH: images/ubuntu-noble-core/Dockerfile

jobs:
  publish-core:
    name: Build Core
    runs-on: [kasm-builder, repo-squirrelworks, resources-small]
    outputs:
      repo_path: ${{ steps.prep.outputs.repo_path }}
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config-inline: |
            [registry."forge.konderla.org"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Builds the Dockerfile's `lint` stage (shellcheck + hadolint), which is
      # defined + referenced in images.json but was never run by CI.
      # Starts non-blocking; flip `continue-on-error` to false once it is green.
      - name: Lint (shellcheck + hadolint)
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: lint
          platforms: linux/amd64
          push: false
          pull: true

      - name: Extract Tags from images.json
        id: prep
        run: |
          JSON_FILE="$GITHUB_WORKSPACE/images.json"
          ENV_SELECTION="${{ github.event.inputs.target_env || 'develop' }}"
          
          if [ "$ENV_SELECTION" = "production" ]; then
            TAG_ARRAY="prodTags"
            TARGET_KEY="prodTarget"
          else
            TAG_ARRAY="devTags"
            TARGET_KEY="devTarget"
          fi
          
          IMAGE_CONFIG=$(jq -c ".images[] | select(.key == \"${{ env.IMAGE_KEY }}\")" "$JSON_FILE")
          RAW_TAGS=$(echo "$IMAGE_CONFIG" | jq -r ".${TAG_ARRAY}[]")
          REPO_FORGE=$(echo "$IMAGE_CONFIG" | jq -r ".repo_forge")
          
          echo "repo_path=${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}" >> "$GITHUB_OUTPUT"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $RAW_TAGS; do
            echo "${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"
          
          BUILD_TARGET=$(echo $IMAGE_CONFIG | jq -r ".${TARGET_KEY}")
          echo "target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Build & Push Foundation Image
        id: build_image
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: ${{ steps.prep.outputs.target }}
          platforms: linux/amd64
          push: true
          pull: true      
          no-cache: true  
          tags: ${{ steps.prep.outputs.tags }}

  calculate-size:
    name: Size Calculation
    needs: publish-core
    uses: ./.forgejo/workflows/calculate-size.yml
    with:
      image_path: "${{ needs.publish-core.outputs.repo_path }}@${{ needs.publish-core.outputs.digest }}"
      image_key: "ubuntu-noble-core"
      runner: '["kasm-builder", "repo-squirrelworks", "resources-small"]'
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  security-scan:
    name: Core Scan
    needs: publish-core
    uses: ./.forgejo/workflows/trivy-scan.yml
    with:
      image_path: "${{ needs.publish-core.outputs.repo_path }}@${{ needs.publish-core.outputs.digest }}"
      image_key: "ubuntu-noble-core"
      skip_scan: ${{ github.event.inputs.skip_scan == 'true' }}
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
