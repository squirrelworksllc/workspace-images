name: Build Noble Core (develop)
run-name: Core Foundation Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/ubuntu-noble-core/**'
  workflow_dispatch:

concurrency:
  group: build-core-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks

jobs:
  publish-core:
    name: Build Core – ubuntu-noble-core
    runs-on: kasm-builder
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Foundation Image
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: images/ubuntu-noble-core/Dockerfile
          target: develop
          push: true
          pull: true      
          no-cache: true  
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-core:develop
