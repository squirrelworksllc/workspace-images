name: Build Noble Core
run-name: Core Foundation Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/ubuntu-noble-core/**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Build Target Environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - production

concurrency:
  group: build-core-${{ github.event.inputs.target_env || 'develop' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  IMAGE_KEY: ubuntu-noble-core
  DOCKERFILE_PATH: images/ubuntu-noble-core/Dockerfile

jobs:
  publish-core:
    name: Build Core
    runs-on: [kasm-builder, repo-squirrelworks]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config-inline: |
            [registry."forge.konderla.org"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Tags from images.json
        id: prep
        run: |
          JSON_FILE="$GITHUB_WORKSPACE/images.json"
          ENV_SELECTION="${{ github.event.inputs.target_env || 'develop' }}"
          
          if [ "$ENV_SELECTION" = "production" ]; then
            TAG_ARRAY="prodTags"
            TARGET_KEY="prodTarget"
          else
            TAG_ARRAY="devTags"
            TARGET_KEY="devTarget"
          fi
          
          IMAGE_CONFIG=$(jq -c ".images[] | select(.key == \"${{ env.IMAGE_KEY }}\")" "$JSON_FILE")
          RAW_TAGS=$(echo "$IMAGE_CONFIG" | jq -r ".${TAG_ARRAY}[]")
          
          # Read your new harbor mapping variable from the JSON config natively
          REPO_FORGE=$(echo "$IMAGE_CONFIG" | jq -r ".repo_forge")
          
          # Export the base repository path for the VEX digest attestation
          echo "repo_path=${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}" >> "$GITHUB_OUTPUT"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $RAW_TAGS; do
            echo "${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"
          
          BUILD_TARGET=$(echo $IMAGE_CONFIG | jq -r ".${TARGET_KEY}")
          echo "target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Build & Push Foundation Image
        id: build_image
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: ${{ steps.prep.outputs.target }}
          push: true
          pull: true      
          no-cache: true  
          tags: ${{ steps.prep.outputs.tags }}

      - name: Install VEX Toolchain Engine
        run: |
          wget https://github.com/openvex/vexctl/releases/latest/download/vexctl-linux-amd64
          mv vexctl-linux-amd64 /usr/local/bin/vexctl
          chmod +x /usr/local/bin/vexctl

      - name: Decoupled OpenVEX Attestation
        run: |
          COMMON_VEX="images/vex_ubuntu_common.json"
          IMAGE_DIR=$(dirname "${{ env.DOCKERFILE_PATH }}")
          LOCAL_VEX="${IMAGE_DIR}/vex.json"
          
          VEX_FILES=""
          if [ -f "$COMMON_VEX" ]; then
            echo "==== [VEX] Ingesting common baseline rules: $COMMON_VEX ===="
            VEX_FILES="$COMMON_VEX"
          fi
          
          if [ -f "$LOCAL_VEX" ]; then
            echo "==== [VEX] Ingesting localized exceptions profile: $LOCAL_VEX ===="
            VEX_FILES="$VEX_FILES $LOCAL_VEX"
          fi
          
          if [ -n "$VEX_FILES" ]; then
            # Reverting to the tag array because vexctl explicitly requires a tag reference to generate the .att signature
            CLEAN_TAGS=$(echo "${{ steps.prep.outputs.tags }}" | sed '/^[A-Za-z0-9+/=]\{20,\}$/d')
            
            for TARGET_IMAGE in $CLEAN_TAGS; do
              echo "[VEX] Committing layered profiles to image tag: $TARGET_IMAGE"
              vexctl attest --attach $VEX_FILES "$TARGET_IMAGE"
            done
            
            echo "==== [VEX] Multi-stage profile composition completed successfully ===="
          else
            echo "==== [VEX] No common or localized profile documents located. Skipping. ===="
          fi

      - name: Post-Build Workspace Garbage Collection
        run: |
          docker builder prune -f
          docker system prune -f
        if: always()
