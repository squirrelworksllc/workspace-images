name: Build Noble DinD
run-name: DinD Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/ubuntu-noble-dind/**'
  workflow_run:
    workflows: ["Build Noble Core"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Build Target Environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - production

concurrency:
  group: build-dind-${{ github.event.inputs.target_env || 'develop' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks
  IMAGE_KEY: ubuntu-noble-dind
  DOCKERFILE_PATH: images/ubuntu-noble-dind/Dockerfile

jobs:
  build-workspace:
    name: Build Workspace
    runs-on: [kasm-builder, repo-squirrelworks]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git Diff Guard (Prevent Race Conditions)
        if: ${{ github.event_name == 'push' }}
        id: diff_check
        run: |
          echo "Analyzing commit changesets..."
          if git diff --name-only HEAD~1 HEAD | grep -q 'images/ubuntu-noble-core/'; then
            echo "::notice:: Core foundation files were modified in this same commit. Standing down to allow the upstream Build Noble Core workflow to finish first."
            exit 1
          fi
          echo "No core changes detected. Proceeding with immediate standalone workspace build."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Tags from images.json
        id: prep
        run: |
          # Use $GITHUB_WORKSPACE to ensure we always find the file at the repo root
          JSON_FILE="$GITHUB_WORKSPACE/images.json"
          
          ENV_SELECTION="${{ github.event.inputs.target_env || 'develop' }}"
          
          if [ "$ENV_SELECTION" = "production" ]; then
            TAG_ARRAY="prodTags"
            TARGET_KEY="prodTarget"
          else
            TAG_ARRAY="devTags"
            TARGET_KEY="devTarget"
          fi
          
          # Pass the path to the jq command
          IMAGE_CONFIG=$(jq -c ".images[] | select(.key == \"${{ env.IMAGE_KEY }}\")" "$JSON_FILE")
          
          RAW_TAGS=$(echo "$IMAGE_CONFIG" | jq -r ".${TAG_ARRAY}[]")
          REPO=$(echo "$IMAGE_CONFIG" | jq -r ".repo")
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $RAW_TAGS; do
            echo "${{ env.HARBOR_REGISTRY }}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"
          
          BUILD_TARGET=$(echo $IMAGE_CONFIG | jq -r ".${TARGET_KEY}")
          echo "target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Compile and Push Workspace
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: ${{ steps.prep.outputs.target }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: true
          tags: ${{ steps.prep.outputs.tags }}

      - name: Post-Build Workspace Garbage Collection
        run: |
          docker builder prune -f
          docker system prune -f
        if: always()
