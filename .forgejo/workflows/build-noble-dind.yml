name: Build Noble DinD (develop)
run-name: DinD Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/ubuntu-noble-dind/**'
  workflow_run:
    workflows: ["Build Noble Core (develop)"]
    types:
      - completed

concurrency:
  group: build-dind-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks
  IMAGE_KEY: dind
  DOCKERFILE_PATH: images/ubuntu-noble-dind/Dockerfile

jobs:
  build-workspace:
    name: Build Workspace – ubuntu-noble-dind
    runs-on: kasm-builder
    # If triggered by workflow_run, only run if the upstream core build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git Diff Guard (Prevent Race Conditions)
        if: ${{ github.event_name == 'push' }}
        id: diff_check
        run: |
          echo "Analyzing commit changesets..."
          if git diff --name-only HEAD~1 HEAD | grep -q 'images/ubuntu-noble-core/'; then
            echo "::notice:: Core foundation files were modified in this same commit. Standing down to allow the upstream Build Noble Core workflow to finish first."
            exit 1
          fi
          echo "No core changes detected. Proceeding with immediate standalone workspace build."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."forge.konderla.org"]
              insecure = true

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compile and Push Workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: develop
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-${{ env.IMAGE_KEY }}:develop
