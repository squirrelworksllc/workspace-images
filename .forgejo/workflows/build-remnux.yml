name: Build REMnux (develop)
run-name: REMnux Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/remnux/**'
  workflow_run:
    workflows: ["Build Noble Core (develop)"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: build-remnux-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: remnux-kasm
  IMAGE_KEY: remnux
  DOCKERFILE_PATH: images/remnux/Dockerfile

jobs:
  build-isolated-remnux:
    name: Build Workspace – remnux
    runs-on: kasm-builder
    timeout-minutes: 120  
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git Diff Guard (Prevent Race Conditions)
        if: ${{ github.event_name == 'push' }}
        id: diff_check
        run: |
          echo "Analyzing commit changesets..."
          if git diff --name-only HEAD~1 HEAD | grep -q 'images/ubuntu-noble-core/'; then
            echo "::notice:: Core foundation files were modified in this same commit. Standing down to allow upstream Build Noble Core to finish first."
            exit 1
          fi
          echo "No core changes detected. Proceeding with immediate standalone REMnux build."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Isolated Harbor Project
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compile and Push Isolated Workspace
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: develop
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: false # <--- DISABLES THE BUILDKIT VULNERABILITY/ASSET SCANNER PHASE COMPLETELY
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_KEY }}:develop

      - name: Post-Build Workspace Garbage Collection
        run: |
          docker builder prune -f
          docker system prune -f
        if: always()  # <--- CRITICAL: Guarantees cleanup runs on success OR failure
