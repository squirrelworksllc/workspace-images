name: Publish REMnux (develop) - Isolated Security Pipeline
run-name: Develop-branch REMnux Compile triggered by ${{ github.actor }}

on:
  workflow_run:
    workflows: ["Publish (develop) - In-House Forgejo Parallel Engine"]
    types:
      - completed

concurrency:
  group: build-remnux-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: remnux-kasm
  IMAGE_KEY: remnux
  DOCKERFILE_PATH: images/remnux/Dockerfile

jobs:
  build-isolated-remnux:
    name: Build Workspace – ubuntu-noble-remnux
    runs-on: kasm-builder
    # Guard rail: Only execute if the upstream pipeline completed with absolute success
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."forge.konderla.org"]
              insecure = true

      - name: Login to Isolated Harbor Project
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compile and Push Isolated Workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: develop
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-${{ env.IMAGE_KEY }}:develop
