name: Build REMnux
run-name: REMnux Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - 'images/remnux/**'
  workflow_run:
    workflows: ["Build Noble Core"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Build Target Environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - production

concurrency:
  group: build-remnux-${{ github.event.inputs.target_env || 'develop' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  IMAGE_KEY: remnux
  DOCKERFILE_PATH: images/remnux/Dockerfile

jobs:
  build-isolated-remnux:
    name: Build Workspace
    runs-on: [kasm-builder, repo-remnux-kasm]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git Diff Guard (Prevent Race Conditions)
        if: ${{ github.event_name == 'push' }}
        id: diff_check
        run: |
          echo "Analyzing commit changesets..."
          if git diff --name-only HEAD~1 HEAD | grep -q 'images/ubuntu-noble-core/'; then
            echo "::notice:: Core foundation files were modified in this same commit. Standing down to allow upstream Build Noble Core to finish first."
            exit 1
          fi
          echo "No core changes detected. Proceeding with immediate standalone REMnux build."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config-inline: |
            [registry."forge.konderla.org"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Tags from images.json
        id: prep
        run: |
          JSON_FILE="$GITHUB_WORKSPACE/images.json"
          ENV_SELECTION="${{ github.event.inputs.target_env || 'develop' }}"
          
          if [ "$ENV_SELECTION" = "production" ]; then
            TAG_ARRAY="prodTags"
            TARGET_KEY="prodTarget"
          else
            TAG_ARRAY="devTags"
            TARGET_KEY="devTarget"
          fi
          
          IMAGE_CONFIG=$(jq -c ".images[] | select(.key == \"${{ env.IMAGE_KEY }}\")" "$JSON_FILE")
          RAW_TAGS=$(echo "$IMAGE_CONFIG" | jq -r ".${TAG_ARRAY}[]")
          REPO_FORGE=$(echo "$IMAGE_CONFIG" | jq -r ".repo_forge")
          
          # Export the base repository path for the VEX digest attestation
          echo "repo_path=${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}" >> "$GITHUB_OUTPUT"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> "$GITHUB_OUTPUT"
          for TAG in $RAW_TAGS; do
            echo "${{ env.HARBOR_REGISTRY }}/${REPO_FORGE}:${TAG}" >> "$GITHUB_OUTPUT"
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"
          
          BUILD_TARGET=$(echo $IMAGE_CONFIG | jq -r ".${TARGET_KEY}")
          echo "target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Compile and Push Isolated Workspace
        id: build_image
        uses: docker/build-push-action@v6
        timeout-minutes: 120
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          target: ${{ steps.prep.outputs.target }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: false
          tags: ${{ steps.prep.outputs.tags }}

      - name: Install VEX Toolchain Engine
        run: |
          wget https://github.com/openvex/vexctl/releases/latest/download/vexctl-linux-amd64
          mv vexctl-linux-amd64 /usr/local/bin/vexctl
          chmod +x /usr/local/bin/vexctl

      - name: Decoupled OpenVEX Attestation
        run: |
          COMMON_VEX="images/vex_ubuntu_common.json"
          IMAGE_DIR=$(dirname "${{ env.DOCKERFILE_PATH }}")
          LOCAL_VEX="${IMAGE_DIR}/vex.json"
          
          VEX_FILES=""
          if [ -f "$COMMON_VEX" ]; then
            echo "==== [VEX] Ingesting common baseline rules: $COMMON_VEX ===="
            VEX_FILES="$COMMON_VEX"
          fi
          
          if [ -f "$LOCAL_VEX" ]; then
            echo "==== [VEX] Ingesting localized exceptions profile: $LOCAL_VEX ===="
            VEX_FILES="$VEX_FILES $LOCAL_VEX"
          fi
          
          if [ -n "$VEX_FILES" ]; then
            TARGET_DIGEST="${{ steps.prep.outputs.repo_path }}@${{ steps.build_image.outputs.digest }}"
            
            echo "[VEX] Committing layered profiles to REMnux digest: $TARGET_DIGEST"
            vexctl attest --attach $VEX_FILES "$TARGET_DIGEST"
            
            echo "==== [VEX] Multi-stage profile composition completed successfully ===="
          else
            echo "==== [VEX] No common or localized profile documents located. Skipping. ===="
          fi

      - name: Post-Build Workspace Garbage Collection
        run: |
          docker builder prune -f
          docker system prune -f
        if: always()
