name: Publish (develop) - Forgejo Automation

on:
  push:
    branches:
      - develop

concurrency:
  group: publish-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES_JSON: .vscode/images.json
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks

jobs:
  # Lints the core image (ubuntu-noble-core) if enabled.
  validate-core:
    name: Lint dev – ubuntu-noble-core
    runs-on: kasm-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get core image config
        id: core-config
        shell: bash
        run: |
          CORE_CONFIG=$(jq -r '.images[] | select(.key == "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")
          if [ -z "$CORE_CONFIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo "$CORE_CONFIG" | jq -r '.dockerfile')" >> "$GITHUB_OUTPUT"
          echo "lintTarget=$(echo "$CORE_CONFIG" | jq -r '.lintTarget')" >> "$GITHUB_OUTPUT"

      - name: Login to Local Harbor
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Lint – ubuntu-noble-core
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.core-config.outputs.dockerfile }}
          target: ${{ steps.core-config.outputs.lintTarget }}
          push: false

  # Generates a dynamic JSON matrix of enabled non-core images.
  matrix-others:
    name: Build matrix (non-core)
    runs-on: kasm-builder
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_entries: ${{ steps.set.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix from images.json
        id: set
        shell: bash
        run: |
          set -euo pipefail

          # Query objects that are enabled and not the core foundation layer
          mapfile -t IMAGES_ARRAY < <(jq -c '.images[] | select(.key != "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")

          if [ ${#IMAGES_ARRAY[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON_ENTRIES=""
          for image_str in "${IMAGES_ARRAY[@]}"; do
            key=$(jq -r '.key' <<< "$image_str")
            dockerfile=$(jq -r '.dockerfile' <<< "$image_str")
            devTarget=$(jq -r '.devTarget' <<< "$image_str")
            lintTarget=$(jq -r '.lintTarget' <<< "$image_str")
            
            # Re-map target repository path cleanly to your local Harbor namespace
            local_repo="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${key}"
            archs=$(jq -r '(if .architectures then .architectures else ["linux/amd64"] end) | join(",")' <<< "$image_str")

            tags_array=$(jq '.devTags' <<< "$image_str")
            tag_string=""
            if [[ "$tags_array" != "null" ]]; then
              mapfile -t tags < <(jq -r '.[]' <<< "$tags_array")
              for tag in "${tags[@]}"; do
                if [[ -z "$tag_string" ]]; then
                  tag_string="${local_repo}:${tag}"
                else
                  tag_string+=$(printf '\n%s:%s' "$local_repo" "$tag")
                fi
              done
            fi

            entry=$(jq -c -n \
              --arg key "$key" --arg dockerfile "$dockerfile" --arg devTarget "$devTarget" \
              --arg lintTarget "$lintTarget" --arg repo "$local_repo" --arg tags "$tag_string" \
              --arg architectures "$archs" \
              '{key: $key, dockerfile: $dockerfile, devTarget: $devTarget, lintTarget: $lintTarget, repo: $repo, tags: $tags, architectures: $architectures}')

            JSON_ENTRIES+="${entry},"
          done

          MATRIX="[${JSON_ENTRIES%,}]"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has_entries=true" >> "$GITHUB_OUTPUT"

  # Lints all active non-core images in parallel on the host socket.
  validate-others:
    name: Lint dev – ${{ matrix.key }}
    runs-on: kasm-builder
    needs: [matrix-others]
    if: needs.matrix-others.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-others.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Lint – ${{ matrix.key }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.lintTarget }}
          push: false

  # Control barrier ensuring lints are stable.
  lint-gate:
    name: lint / gate
    runs-on: kasm-builder
    needs: [validate-core, validate-others]
    if: always()
    steps:
      - name: Check linting results
        run: |
          if [[ "${{ needs.validate-core.result }}" == "failure" || "${{ needs.validate-others.result }}" == "failure" ]]; then
            echo "Linting gate failed. Blocking build process."
            exit 1
          fi
          echo "All checks clear."

  # Builds and stages the multi-arch core foundation image into Harbor.
  publish-core:
    name: Publish dev – ubuntu-noble-core
    runs-on: kasm-builder
    needs: [lint-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get core image config
        id: core-config
        shell: bash
        run: |
          CORE_CONFIG=$(jq -r '.images[] | select(.key == "ubuntu-noble-core" and .enabled != false)' "$IMAGES_JSON")
          if [ -z "$CORE_CONFIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo "$CORE_CONFIG" | jq -r '.dockerfile')" >> "$GITHUB_OUTPUT"
          echo "devTarget=$(echo "$CORE_CONFIG" | jq -r '.devTarget')" >> "$GITHUB_OUTPUT"
          echo "architectures=$(echo "$CORE_CONFIG" | jq -r '(if .architectures then .architectures else ["linux/amd64"] end) | join(",")')" >> "$GITHUB_OUTPUT"

          local_repo="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-core"
          tags_array=$(echo "$CORE_CONFIG" | jq '.devTags')
          tag_string=""
          if [[ "$tags_array" != "null" ]]; then
            mapfile -t tags < <(jq -r '.[]' <<< "$tags_array")
            for tag in "${tags[@]}"; do
              if [[ -z "$tag_string" ]]; then
                tag_string="${local_repo}:${tag}"
              else
                tag_string+=$(printf '\n%s:%s' "$local_repo" "$tag")
              fi
            done
          fi

          {
            echo 'tags<<EOF'
            echo "$tag_string"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Login to Local Harbor
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Build & push – ubuntu-noble-core
        if: steps.core-config.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.core-config.outputs.dockerfile }}
          target: ${{ steps.core-config.outputs.devTarget }}
          platforms: ${{ steps.core-config.outputs.architectures }}
          push: true
          tags: ${{ steps.core-config.outputs.tags }}

  # Compiles and pushes all subsequent matrix components natively to Harbor.
  publish-others:
    name: Publish dev – ${{ matrix.key }}
    runs-on: kasm-builder
    needs: [publish-core, matrix-others]
    if: needs.matrix-others.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-others.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Build & push – ${{ matrix.key }}
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.devTarget }}
          platforms: ${{ matrix.architectures }}
          push: true
          tags: ${{ matrix.tags }}

      - name: Verification Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.push.outcome }}" != "success" ]; then
            echo "Compilation step failed for ${{ matrix.key }}"
            exit 1
          fi
          echo "Successfully pushed target asset."
