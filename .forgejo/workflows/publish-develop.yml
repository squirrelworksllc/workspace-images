name: Publish (develop) - In-House Forgejo Parallel Engine
run-name: Develop-branch Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop

concurrency:
  group: publish-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks

jobs:
  # STEP 1: Compile the foundation layer first (Sequential dependency gate)
  publish-core:
    name: Build Core – ubuntu-noble-core
    runs-on: kasm-builder
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."forge.konderla.org"]
              insecure = true

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Foundation Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/ubuntu-noble-core/Dockerfile
          target: develop
          push: true
          pull: true      
          no-cache: true  
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-core:develop

  # STEP 2: Fan out all child workspaces concurrently across available kasm-builder runners
  publish-others:
    name: Parallel Build – ubuntu-noble-${{ matrix.workspace.key }}
    runs-on: kasm-builder
    needs: [publish-core]
    strategy:
      fail-fast: false  # Don't kill other workspace builds if one fails
      matrix:
        # HARDWARE SCALING ENGINE: Tightly defines the assets so Forgejo can distribute them instantly
        workspace:
          - key: "desktop"
            dockerfile: "images/ubuntu-noble-desktop/Dockerfile"
          - key: "dind"
            dockerfile: "images/ubuntu-noble-dind/Dockerfile"
          - key: "remnux"
            dockerfile: "images/remnux/Dockerfile"
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."forge.konderla.org"]
              insecure = true

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compile and Push Workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.workspace.dockerfile }}
          target: develop
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          sbom: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-${{ matrix.workspace.key }}:develop
