name: Publish (develop) - Forgejo Parallel Engine
run-name: Dev Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop

concurrency:
  group: publish-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES_JSON: .vscode/images.json
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks

jobs:
  # STEP 1: Parse JSON configurations dynamically to build the execution matrix
  generate-matrix:
    name: Map Active Images
    runs-on: kasm-builder
    outputs:
      non_core_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Parse Images Configuration
        id: set-matrix
        shell: bash
        run: |
          # Filters out disabled images and the core image to generate a clean parallel array
          MATRIX_JSON=$(jq -c '[.images[] | select(.key != "ubuntu-noble-core" and .enabled != false)]' "$IMAGES_JSON")
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  # STEP 2: Compile the foundation layer first (Sequential dependency gate)
  publish-core:
    name: Build Core – ubuntu-noble-core
    runs-on: kasm-builder
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Foundation Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/ubuntu-noble-core/Dockerfile
          target: develop  # FIXED: Matched to target stage from your core Dockerfile
          push: true
          pull: true      
          no-cache: true  
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-core:develop

  # STEP 3: Fan out all remaining enabled images to multiple runners concurrently
  publish-others:
    name: Parallel Build – ${{ matrix.image.key }}
    runs-on: kasm-builder
    needs: [generate-matrix, publish-core]
    strategy:
      fail-fast: false  
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.non_core_matrix) }}
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Parse Image Metadata
        id: meta
        shell: bash
        run: |
          # Safe fallback to standard arch if none provided
          ARCHS=$(echo '${{ toJSON(matrix.image.architectures) }}' | jq -r '(if . and length > 0 then . else ["linux/amd64"] end) | join(",")')
          echo "platforms=${ARCHS}" >> "$GITHUB_OUTPUT"

          # Transform JSON arrays cleanly into a standard format for build-push-action
          LOCAL_REPO="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.image.key }}"
          TAGS_JSON='${{ toJSON(matrix.image.devTags) }}'
          
          formatted_tags=""
          if [ "$TAGS_JSON" != "null" ]; then
            while read -r tag; do
              if [ -n "$tag" ]; then
                formatted_tags+="${LOCAL_REPO}:${tag}"$'\n'
              fi
            done < <(echo "$TAGS_JSON" | jq -r '.[]')
          else
            formatted_tags+="${LOCAL_REPO}:develop"$'\n'
          fi
          
          # Secure delimiter block for complex multi-line strings
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$formatted_tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Compile and Push Workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.devTarget }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
