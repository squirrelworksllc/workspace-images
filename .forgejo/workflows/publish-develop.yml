name: Publish (develop) - Forgejo Parallel Engine
run-name: Dev Workspace Compile triggered by ${{ github.actor }}

on:
  push:
    branches:
      - develop

concurrency:
  group: publish-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES_JSON: .vscode/images.json
  HARBOR_REGISTRY: forge.konderla.org
  HARBOR_PROJECT: squirrelworks

jobs:
  # STEP 1: Parse JSON configurations dynamically to build the execution matrix
  generate-matrix:
    name: Map Active Images
    runs-on: kasm-builder
    outputs:
      non_core_matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Parse Images Configuration
        id: set-matrix
        shell: bash
        run: |
          # Filters out disabled images and the core image to generate a clean parallel array
          MATRIX_JSON=$(jq -c '[.images[] | select(.key != "ubuntu-noble-core" and .enabled != false)]' "$IMAGES_JSON")
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  # STEP 2: Compile the foundation layer first (Sequential dependency gate)
  publish-core:
    name: Build Core – ubuntu-noble-core
    runs-on: kasm-builder
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Build & Push Foundation Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/ubuntu-noble-core/Dockerfile
          target: dev
          push: true
          pull: true      # Forces download of latest upstream image to fix vulnerabilities
          no-cache: true  # Prevents pinning old, unpatched system libraries
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ubuntu-noble-core:develop

  # STEP 3: Fan out all remaining enabled images to multiple runners concurrently
  publish-others:
    name: Parallel Build – ${{ matrix.image.key }}
    runs-on: kasm-builder
    needs: [generate-matrix, publish-core]
    strategy:
      fail-fast: false  # Don't cancel other builds if a single workspace fails to compile
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.non_core_matrix) }}
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to local Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: admin
          password: KonderlaHarbor2026!

      - name: Parse Architectures and Tags
        id: Image-metadata
        shell: bash
        run: |
          ARCHS=$(echo '${{ toJSON(matrix.image.architectures) }}' | jq -r '(if . then . else ["linux/amd64"] end) | join(",")')
          echo "architectures=${ARCHS}" >> "$GITHUB_OUTPUT"

          # Format developer tags dynamically for Buildx mapping
          LOCAL_REPO="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.image.key }}"
          TAG_ARGS=""
          mapfile -t TAGS < <(echo '${{ toJSON(matrix.image.devTags) }}' | jq -r '.[]')
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+="-t ${LOCAL_REPO}:${tag} "
          done
          echo "tags=${TAG_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Compile and Push Workspace
        run: |
          # Executes concurrently across multiple runners based on kasm-builder availability
          docker buildx build \
            --file "${{ matrix.image.dockerfile }}" \
            --target "${{ matrix.image.devTarget }}" \
            --platform "${{ steps.image-metadata.outputs.architectures }}" \
            ${{ steps.image-metadata.outputs.tags }} \
            --pull \
            --no-cache \
            --push=true .
